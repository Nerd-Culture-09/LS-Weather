# SonarQube analysis for the LS Weather mini program.
# Run `npm test` first so coverage/lcov.info is fresh, then the scanner:
#   PowerShell:  $env:SONAR_TOKEN = "<token>"; npx @sonar/scan@5.1.0

sonar.projectKey=LS-Weather
sonar.projectName=LS Weather
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# App code lives at the project root (app.js, pages/, components/, ...)
sonar.sources=.
sonar.exclusions=node_modules/**,coverage/**,tests/**,assets/**,.mini-ide-*/**,app.acss

# Jest suites and the fake mini-program runtime in tests/helpers
sonar.tests=tests

# Coverage from `jest --coverage`
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Build/config scripts Jest never loads: don't count them as uncovered
sonar.coverage.exclusions=scripts/**,jest.config.js,tailwind.config.js
